spring.application.name=demo
server.port=8080

# --- Base de datos (por defecto: Postgres del docker-compose expuesto en 5433) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/appdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE

# --- Fechas: respetar el offset que manda el cliente (-05:00) ---
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.jackson.serialization.write-dates-as-timestamps=false

# --- JWT ---
jwt.secret=${JWT_SECRET:cambia-esta-clave-super-secreta-de-al-menos-32-bytes-123456}
# segundos
jwt.expiration=3600
